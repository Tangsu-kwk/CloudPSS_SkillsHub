<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{REPORT_TITLE}}</title>
  <!-- REPORT_PLOTLY -->
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body { margin: 0; background: #f5f7fa; color: #1f2937; font-family: Arial, "Microsoft YaHei", sans-serif; }
    main { max-width: 1440px; margin: 0 auto; padding: 28px; }
    header, section, footer { margin-bottom: 24px; }
    .report-header, .card, .chart { background: #fff; border: 1px solid #e5e7eb; border-radius: 8px; padding: 22px; }
    .metric-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 12px; }
    .metric { background: #fff; border-top: 3px solid #2563eb; padding: 14px; }
    .chart { min-height: 380px; }
    .report-plotly-notice { margin: 0; padding: 14px; color: #92400e; background: #fffbeb; border: 1px solid #fcd34d; border-radius: 6px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 10px; border-bottom: 1px solid #e5e7eb; text-align: left; }
    th { background: #eef4fb; }
    @media (max-width: 720px) { main { padding: 14px; } .chart { min-height: 320px; } }
  </style>
</head>
<body>
  <main>
    <!-- 替换全部占位符并删除未使用区块；不得将占位符交付给用户。 -->
    <header class="report-header">
      <h1>{{REPORT_TITLE}}</h1>
      <p>{{REPORT_SUBTITLE}}</p>
    </header>
    <section id="summary">{{EXECUTIVE_SUMMARY}}</section>
    <section id="evidence">{{DYNAMIC_EVIDENCE}}</section>
    <section id="discussion">{{DYNAMIC_DISCUSSION}}</section>
    <footer>{{SOURCES_AND_PROVENANCE}}</footer>
  </main>
</body>
</html>
